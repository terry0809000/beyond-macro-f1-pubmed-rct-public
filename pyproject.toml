[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plos-nlp-release"
version = "1.0.0"
description = "Verification and reproducibility utilities for the PubMed RCT sentence-classification release"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
authors = [
  {name = "Tianyi Yu", email = "tianyi.1.yu@kcl.ac.uk"},
]
keywords = [
  "biomedical-nlp",
  "sentence-classification",
  "pubmed-rct",
  "calibration",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
analysis = [
  "IPython>=8,<11",
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "torch>=2.7,<3",
  "transformers>=4.46,<6",
  "tokenizers>=0.20,<0.24",
  "datasets>=2.19,<5",
  "accelerate>=1.1,<2",
  "huggingface-hub>=0.26,<2",
  "safetensors>=0.4.3,<1",
  "psutil>=5.9,<8",
  "joblib>=1.3,<2",
  "packaging>=23,<27",
  "Pillow>=10,<13",
  "sklearn-crfsuite==0.5.0",
]

[project.scripts]
plos-verify-release = "plos_nlp_release.verify_release:main"

[project.urls]
Repository = "https://github.com/terry0809000/beyond-macro-f1-pubmed-rct-public"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
